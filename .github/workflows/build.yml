name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FM27FaceStudio
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets/icon.png;assets"
          --collect-data cv2
          --exclude-module tkinter
          main.py

      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/FM27FaceStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test failed: $($p.ExitCode)" }
          Get-Item dist/FM27FaceStudio.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FM27FaceStudio
          path: dist/FM27FaceStudio.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FM27FaceStudio.exe
          generate_release_notes: true
