name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get face model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Linzaer/Ultra-Light-Fast-Generic-Face-Detector-1MB/master/models/onnx/version-RFB-320.onnx" -OutFile models/ultraface-rfb-320.onnx
          Get-Item models/ultraface-rfb-320.onnx | Select-Object Name, Length

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FMFaceStudio
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets/icon.png;assets"
          --add-data "models;models"
          --add-data "THIRD_PARTY_NOTICES.txt;."
          --add-data "plugin_dist;plugin_dist"
          --collect-submodules fmsave
          --collect-all backports.zstd
          --splash assets/splash.png
          main.py

      - name: Build app folder (for installer)
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name FMFaceStudio
          --distpath dist_dir --workpath build_dir
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets/icon.png;assets"
          --add-data "models;models"
          --add-data "THIRD_PARTY_NOTICES.txt;."
          --add-data "plugin_dist;plugin_dist"
          --collect-submodules fmsave
          --collect-all backports.zstd
          --splash assets/splash.png
          main.py

      - name: Build installer
        shell: pwsh
        run: |
          $v = (Select-String -Path facepicker/api.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" installer/FMFaceStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          Get-Item dist/FMFaceStudio-Setup.exe | Select-Object Name, Length

      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/FMFaceStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath dist_dir/FMFaceStudio/FMFaceStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test (folder) failed: $($p.ExitCode)" }
          Get-Item dist/FMFaceStudio.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FMFaceStudio
          path: |
            dist/FMFaceStudio.exe
            dist/FMFaceStudio-Setup.exe

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path facepicker/api.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "tag=v$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FM Face Studio ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/FMFaceStudio-Setup.exe
            dist/FMFaceStudio.exe
          make_latest: true
          body: |
            **`FMFaceStudio-Setup.exe`** 를 받아 실행하면 설치돼요 (관리자 권한 필요 없음, 시작 메뉴·바탕화면 바로가기).
            설치 없이 쓰고 싶으면 `FMFaceStudio.exe` 하나만 받아서 바로 실행해도 돼요.

            **처음 실행할 때 파란 "Windows의 PC 보호" 창이 뜨면** → "추가 정보"를 누르고 → "실행"을 누르세요.
            개인이 만든 무료 프로그램이라 디지털 서명이 없어서 뜨는 안내예요.

            문제가 생기면 프로그램의 설정(톱니바퀴) → "오류 보고 파일 만들기"를 눌러서 바탕화면에 생긴 파일을 보내 주세요.
