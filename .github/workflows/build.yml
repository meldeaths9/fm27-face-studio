name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Get face model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force models | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Linzaer/Ultra-Light-Fast-Generic-Face-Detector-1MB/master/models/onnx/version-RFB-320.onnx" -OutFile models/ultraface-rfb-320.onnx
          Get-Item models/ultraface-rfb-320.onnx | Select-Object Name, Length

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FM27FaceStudio
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets/icon.png;assets"
          --add-data "models;models"
          --add-data "THIRD_PARTY_NOTICES.txt;."
          --collect-submodules fmsave
          --collect-all backports.zstd
          --splash assets/splash.png
          main.py

      - name: Build debug exe (console)
        run: >
          pyinstaller --noconfirm --onefile --console
          --name FM27FaceStudio_debug
          --icon assets/icon.ico
          --add-data "ui;ui"
          --add-data "assets/icon.png;assets"
          --add-data "models;models"
          --add-data "THIRD_PARTY_NOTICES.txt;."
          --collect-submodules fmsave
          --collect-all backports.zstd
          main.py

      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/FM27FaceStudio.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self test failed: $($p.ExitCode)" }
          Get-Item dist/FM27FaceStudio.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FM27FaceStudio
          path: dist/*.exe

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path facepicker/api.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "tag=v$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FM27 Face Studio ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/FM27FaceStudio.exe
            dist/FM27FaceStudio_debug.exe
          make_latest: true
          body: |
            `FM27FaceStudio.exe`를 받아서 더블클릭하면 실행돼요. 파이썬 설치는 필요 없어요.
            처음 실행할 때 윈도우 보안 경고(SmartScreen)가 뜨면 "추가 정보" → "실행"을 누르세요.
            실행이 안 되면 `FM27FaceStudio_debug.exe`(검은 창에 진행 기록이 나오는 진단용)로 실행해서 내용을 알려주세요.
